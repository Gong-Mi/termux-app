[package]
name = "termux-rust-new"
version = "0.1.0"
edition = "2024"

[lib]
name = "termux_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "termux-rust-engine"
path = "standalone/src/main.rs"

[dependencies]
jni = "0.21.1"
unicode-width = "0.2.2"
nix = { version = "0.31.2", features = ["process", "signal", "term", "ioctl", "fs", "user"] }
libc = "0.2"
rayon = "1.11.0"
simdutf8 = "0.1.4"
base64 = "0.22.1"
zip = "8.2.0"
once_cell = "1.19.0"
crossterm = "0.28.1"
log = "0.4"
skia-safe = { version = "0.93.1", features = ["vulkan"] }
raw-window-handle = "0.6.2"
ash = "0.38.0"
ash-window = "0.13.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9.0"
ndk-sys = "0.6.0"
android_logger = "0.13"

[features]
test-helpers = []

[dev-dependencies]
md5 = "0.7"
rusqlite = { version = "0.31.0", features = ["bundled"] }
unicode-properties = "0.1.0"
unicode-bidi = "0.3.15"
argon2 = "0.5.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
# 保留符号以便 native crash 调试（可改为 "debuginfo" 减少体积）
strip = false

# 测试配置
# Cargo 默认自动发现 tests/ 目录下所有 .rs 文件作为集成测试。
# 仅需显式声明需要特殊配置（如 required-features）的测试。
[[test]]
name = "child_watcher_regression"
path = "tests/child_watcher_regression.rs"
required-features = ["test-helpers"]
