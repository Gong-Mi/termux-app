[package]
name = "termux-exec-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "termux_exec"
crate-type = ["cdylib"]

[[bin]]
name = "termux_exec_device_probe"
path = "src/bin/termux_exec_device_probe.rs"

[[bin]]
name = "test_sigsys"
path = "src/bin/test_sigsys.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.31.2", features = ["fs"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
