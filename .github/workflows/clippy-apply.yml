name: Apply clippy fixes

# One-shot clippy workflow: run manually when the Clippy gate drifts.
# Applies `cargo clippy --fix` (machine-applicable lints only) to the Rust
# tree and pushes the result back to the triggering branch. Mirrors
# fmt-apply.yml: automated cleanup of long-accumulated base drift, not a
# behavior change — codegen-equivalent mechanical lint fixes only.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clippy-fix:
    name: cargo clippy --fix + push
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Apply machine-applicable clippy fixes
        run: |
          cd terminal-emulator/src/main/rust
          # --allow-dirty: the tree is a fresh checkout, cargo requires the
          # flag anyway to write fixes into uncommitted state.
          cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged

      - name: Verify the fixed tree still builds and tests pass
        run: |
          cd terminal-emulator/src/main/rust
          cargo clippy --all-targets --all-features -- -D warnings && \
          cargo test --all-features

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "no clippy fixes to apply"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal-emulator/src/main/rust
          git commit -m "fix: apply machine-applicable clippy lints (automated)"
          git push
