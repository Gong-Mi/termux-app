# Rust CI 工作流
# 用于验证 Rust 终端引擎的代码质量和测试

name: Rust CI

on:
  push:
    branches:
      - master
      - feature/rust-integration
    paths:
      - '.github/workflows/rust-ci.yml'
      - 'terminal-emulator/src/main/rust/**'
  pull_request:
    branches:
      - fix/session-process-owner
      - fix/pty-io-lifecycle
      - fix/engine-adoption
      - fix/engine-handle-lifetime
      - fix/skia-vulkan-api-contract
      - master
      - feature/rust-integration
    paths:
      - '.github/workflows/rust-ci.yml'
      - 'terminal-emulator/src/main/rust/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rust 代码格式检查
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: |
          cd terminal-emulator/src/main/rust
          cargo fmt -- --check

  # Rust 代码静态分析
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install native test libraries
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
      
      # Cache dependencies even while inherited lint failures keep this job red.
      # Job ID keeps all-features Clippy separate from default-feature rustdoc.
      - name: Cache Clippy dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: terminal-emulator/src/main/rust -> target
          key: host-clippy-all-features
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST SKIA FORCE_SKIA ImageOS ImageVersion
          cache-bin: "false"
          cache-on-failure: "true"

      - name: Run Clippy
        run: |
          cd terminal-emulator/src/main/rust
          cargo clippy --all-targets --all-features -- -D warnings

  # Host correctness is owned by rust-quality.yml on PR and push.

  # Android 交叉编译检查
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
          - x86_64-linux-android
    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@3.5.0

      - name: Identify actual Android NDK
        id: ndk
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          ndk = os.environ.get("ANDROID_NDK_HOME") or os.environ.get("ANDROID_NDK_ROOT")
          if not ndk:
              raise SystemExit("Runner did not expose an Android NDK; cannot key native cache safely")
          root = Path(ndk).resolve()
          identity = hashlib.sha256((root / "source.properties").read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"identity={identity}\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"ANDROID_NDK_HOME={root}\n")
          print((root / "source.properties").read_text())
          PY

      # rust-cache includes rustc identity and Cargo manifests/lock/config;
      # additionally separate ABI, API, NDK, profile and native build environment.
      - name: Cache Android dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: terminal-emulator/src/main/rust -> target
          key: android-${{ matrix.target }}-api26-release-ndk-${{ steps.ndk.outputs.identity }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ANDROID_NDK SKIA FORCE_SKIA ImageOS ImageVersion
          cache-bin: "false"
      
      - name: Build for ${{ matrix.target }}
        run: |
          cd terminal-emulator/src/main/rust
          # Match the existing gradle.properties minSdkVersion=26 and Skia 0.93.1's
          # API 26 C++ build; API 24 here conflicts with Skia's __ANDROID_API__=26.
          # Local contract: python3 scripts/verify-rust-android-ci.py (from repo root).
          cargo ndk -t ${{ matrix.target == 'aarch64-linux-android' && 'arm64-v8a' || matrix.target == 'armv7-linux-androideabi' && 'armeabi-v7a' || matrix.target == 'i686-linux-android' && 'x86' || 'x86_64' }} -p 26 build --release
        
        env:
          CARGO_TARGET_${{ matrix.target == 'aarch64-linux-android' && 'AARCH64' || matrix.target == 'armv7-linux-androideabi' && 'ARMV7' || matrix.target == 'i686-linux-android' && 'I686' || 'X86_64' }}_LINKER: clang

  # Native ARM64 acceptance is deferred while ARM runners are unavailable.
  # The x86_64 rust-quality.yml jobs own host correctness; do not duplicate them.
  # Android ARM cross-compilation remains in android-build (not native execution).

  # 文档检查
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native test libraries
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
      
      - name: Cache documentation dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: terminal-emulator/src/main/rust -> target
          key: host-doc-default-features
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST SKIA FORCE_SKIA ImageOS ImageVersion
          cache-bin: "false"

      - name: Build Documentation
        run: |
          cd terminal-emulator/src/main/rust
          cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
