# Rust CI 工作流
# 用于验证 Rust 终端引擎的代码质量和测试

name: Rust CI

on:
  push:
    branches:
      - master
      - feature/rust-integration
    paths:
      - '.github/workflows/rust-ci.yml'
      - 'terminal-emulator/src/main/rust/**'
  pull_request:
    branches:
      - master
      - feature/rust-integration
    paths:
      - '.github/workflows/rust-ci.yml'
      - 'terminal-emulator/src/main/rust/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rust 代码格式检查
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: |
          cd terminal-emulator/src/main/rust
          cargo fmt -- --check

  # Rust 代码静态分析
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install native test libraries
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
      
      - name: Run Clippy
        run: |
          cd terminal-emulator/src/main/rust
          cargo clippy --all-targets --all-features -- -D warnings

  # Host correctness is owned by rust-quality.yml on PR and push.

  # Android 交叉编译检查
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
          - x86_64-linux-android
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.0
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            terminal-emulator/src/main/rust/target
          key: ${{ runner.os }}-cargo-android-${{ matrix.target }}-${{ hashFiles('terminal-emulator/src/main/rust/Cargo.lock') }}
      
      - name: Build for ${{ matrix.target }}
        run: |
          cd terminal-emulator/src/main/rust
          # Match the existing gradle.properties minSdkVersion=26 and Skia 0.93.1's
          # API 26 C++ build; API 24 here conflicts with Skia's __ANDROID_API__=26.
          # Local contract: python3 scripts/verify-rust-android-ci.py (from repo root).
          cargo ndk -t ${{ matrix.target == 'aarch64-linux-android' && 'arm64-v8a' || matrix.target == 'armv7-linux-androideabi' && 'armeabi-v7a' || matrix.target == 'i686-linux-android' && 'x86' || 'x86_64' }} -p 26 build --release
        
        env:
          CARGO_TARGET_${{ matrix.target == 'aarch64-linux-android' && 'AARCH64' || matrix.target == 'armv7-linux-androideabi' && 'ARMV7' || matrix.target == 'i686-linux-android' && 'I686' || 'X86_64' }}_LINKER: clang

  # Native ARM64 acceptance is deferred while ARM runners are unavailable.
  # The x86_64 rust-quality.yml jobs own host correctness; do not duplicate them.
  # Android ARM cross-compilation remains in android-build (not native execution).

  # 文档检查
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native test libraries
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
      
      - name: Build Documentation
        run: |
          cd terminal-emulator/src/main/rust
          cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
