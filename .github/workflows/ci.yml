name: Check

on:
  push:
  workflow_dispatch:

jobs:
  actionlint:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Download actionlint
      id: get_actionlint
      run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
    - name: Check GitHub workflows
      run: ${{ steps.get_actionlint.outputs.executable }} -color

  rust-check:
    name: Check Rust code
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies (Skia linking)
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
    - name: Check Rust formatting
      run: |
        cd terminal-emulator/src/main/rust
        cargo fmt -- --check
    - name: Download Bootstraps (needed for build.rs)
      run: ./gradlew :termux-app:downloadBootstraps
    - name: Run Rust tests
      run: |
        cd terminal-emulator/src/main/rust
        cargo test --lib

  check:
    name: Check gradle build (java ${{ matrix.javaVersion }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        javaVersion: [21]
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Setup java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.javaVersion }}
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
    - name: Lint
      run: ./gradlew lint
    - name: Test
      run: ./gradlew test
    - name: Build Rust
      run: ./gradlew :terminal-emulator:buildAllRust
    - name: Assemble Debug
      shell: bash
      run: |
        ./gradlew assembleDebug
        DIRNAME=upload/termux-debug-apks-"$GITHUB_SHA"
        mkdir -p "$DIRNAME"
        shopt -s globstar; for file in termux-*/**/*.apk; do FILENAME="$(basename "$file")"; cp "$file" "$DIRNAME"/"${FILENAME/.apk/-$GITHUB_SHA.apk}"; done
    - uses: actions/upload-artifact@v7
      if: matrix.javaVersion == '21'
      with:
        name: termux-debug-apks-${{ github.sha }}
        path: upload/

  gradle-wrapper-validation:
    name: Validate gradle wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
