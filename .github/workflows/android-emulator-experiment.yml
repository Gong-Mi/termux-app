name: Android emulator experiment

"on":
  pull_request:
    branches:
      - fix/engine-adoption
      - fix/engine-handle-lifetime
      - feature/rust-integration
    paths:
      - 'app/**'
      - 'terminal-emulator/**'
      - 'terminal-view/**'
      - 'termux-shared/**'
      - 'buildSrc/**'
      - 'scripts/verify-skia-api-ab.py'
      - 'scripts/tests/test_verify_skia_api_ab.py'
      - 'scripts/test-skia-experiment-wiring.py'
      - 'scripts/verify-test-build-ci.py'
      - 'scripts/tests/test_rust_test_runner.py'
      - 'scripts/tests/rust-tier-targets.json'
      - 'gradle/**'
      - '*.gradle*'
      - '.github/workflows/android-emulator-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: 36
  ANDROID_ABI: x86_64
  FAST_BUILD_ABI: x86_64
  PACKAGE_VARIANT: apt-android-7
  SKIA_BINDINGS_SKIP_LAYOUT_ASSERTIONS: 1
  FORCE_SKIA_BUILD: 1
  SKIA_NATIVE_API_LEVEL: 35
  SKIA_USE_VULKAN: 1
  SKIA_USE_GL: 0
  CXXFLAGS: -DSK_TYPEFACE_FACTORY_FREETYPE
  RUST_BACKTRACE: 1

concurrency:
  group: android-emulator-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-startup:
    name: Build, install and cold-start x86_64 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify KVM access before building
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            printf '%s\n' '::error::KVM device missing; this experiment requires hardware acceleration.' >&2
            exit 1
          fi
          # GitHub-hosted ephemeral runner: grant its existing primary group access.
          # Do not run the emulator as root or open KVM to every user.
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          python3 - <<'PY'
          import os
          fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          os.close(fd)
          print('KVM device opened read/write as the unprivileged runner')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Verify A/B oracle and API policy before building
        run: |
          python3 -m unittest discover -s scripts/tests -v
          rustc --edition=2024 --test terminal-emulator/src/main/rust/src/skia_api_contract.rs -o /tmp/skia-api-policy
          /tmp/skia-api-policy

      - name: Verify Android foreground-service manifest
        run: python3 scripts/verify-android-service-manifest.py

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@3.5.0

      - name: Install emulator build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfreetype6-dev libfontconfig1-dev libpulse0
          unzip scripts/gn-linux-amd64.zip -d /tmp/gn-bin
          sudo install -m 0755 /tmp/gn-bin/gn /usr/local/bin/gn
          gn --version
          ninja --version

      - name: Identify actual Android NDK
        id: ndk
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          ndk = os.environ.get("ANDROID_NDK_HOME") or os.environ.get("ANDROID_NDK_ROOT")
          if not ndk:
              raise SystemExit("Runner did not expose an Android NDK; cannot key native cache safely")
          root = Path(ndk).resolve()
          identity = hashlib.sha256((root / "source.properties").read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"identity={identity}\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"ANDROID_NDK_HOME={root}\n")
          print((root / "source.properties").read_text())
          PY

      # Forced Skia source build, API35 and experimental feature must never
      # share native outputs with rust-ci's default-feature API26 builds.
      - name: Cache emulator native dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: terminal-emulator/src/main/rust -> target
          key: emulator-x86_64-api26-skia35-release-skia-api-experiment-ndk-${{ steps.ndk.outputs.identity }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ANDROID_NDK SKIA FORCE_SKIA ImageOS ImageVersion
          cache-bin: "false"
          cache-on-failure: "true"

      - name: Build debug APKs
        env:
          TERMUX_PACKAGE_VARIANT: ${{ env.PACKAGE_VARIANT }}
          TERMUX_APP_VERSION_NAME: 0.118.0+${{ github.sha }}
          TERMUX_APK_VERSION_TAG: emulator-${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          result = subprocess.run([
              './gradlew', 'assembleRelease', '-PskiaApiExperiment=true',
              '--dry-run', '--no-daemon', '--console=plain',
          ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=300)
          print(result.stdout)
          if result.returncode == 0 or 'skiaApiExperiment is restricted to debuggable APK variants' not in result.stdout:
              raise SystemExit('Experiment release guard was not exercised successfully')
          PY
          ./gradlew assembleDebug -PskiaApiExperiment=true --parallel --no-daemon --console=plain
          APK_DIR=app/build/outputs/apk/debug
          test -s "$APK_DIR/termux-app_emulator-${GITHUB_SHA}_x86_64.apk"
          sha256sum "$APK_DIR/termux-app_emulator-${GITHUB_SHA}_x86_64.apk" > apk.sha256
          printf 'headSha=%s\n' "$(git rev-parse HEAD)" > source-identity.txt
          printf 'eventSha=%s\n' "$GITHUB_SHA" >> source-identity.txt
          printf 'apk=%s\n' "$APK_DIR/termux-app_emulator-${GITHUB_SHA}_x86_64.apk" >> source-identity.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36 x86_64 emulator image
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager "platform-tools" "emulator" "platforms;android-${ANDROID_API}" "system-images;android-${ANDROID_API};google_apis;x86_64"
          yes | sdkmanager --licenses >/dev/null || true
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          adb version
          emulator -version

      - name: Create and boot emulator
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name termux-experiment \
            --package "system-images;android-${ANDROID_API};google_apis;x86_64" \
            --device pixel_5
          test -f "$ANDROID_AVD_HOME/termux-experiment.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd termux-experiment \
            -gpu swiftshader_indirect -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -memory 3072 -cores 3 \
            > emulator.log 2>&1 &
          EMULATOR_PID=$!
          printf '%s\n' "$EMULATOR_PID" > emulator.pid
          for i in $(seq 1 15); do
            sleep 60
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "[boot-wait minute $i] sys.boot_completed='$boot'"
            if [ "$boot" = "1" ]; then
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              printf '%s\n' 'Emulator process exited before Android boot completed' >&2
              tail -100 emulator.log >&2 || true
              exit 43
            fi
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell wm size
          adb shell wm density
          adb shell getprop ro.build.version.sdk

      - name: Install exact APK and verify Skia API A/B
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/termux-app_emulator-${GITHUB_SHA}_x86_64.apk"
          adb install -r "$APK"
          adb shell dumpsys package com.termux > package.txt
          python3 scripts/verify-skia-api-ab.py --output skia-api-ab --require-baseline-failure

      - name: Record experiment evidence
        if: always()
        run: |
          {
            echo '### Android emulator experiment'
            printf '%s\n' "- headSha: \`$(git rev-parse HEAD)\`"
            printf '%s\n' "- eventSha: \`${GITHUB_SHA}\`"
            echo "- emulator: API ${ANDROID_API}, x86_64, SwiftShader"
            echo '- claim boundary: see skia-api-ab/summary.json for same-APK API-cap A/B, GPU readback and first-frame result; not physical GPU or sustained rendering evidence'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-emulator-experiment-${{ github.sha }}
          path: |
            apk.sha256
            source-identity.txt
            emulator.log
            emulator.pid
            package.txt
            skia-api-ab/
