name: Engine construction contract

"on":
  pull_request:
    branches: [test/session-completion-art, feat/session-completion-ui, feat/session-completion-bridge, feat/session-completion-candidate, fix/session-delivery-claim, fix/session-completion-observation, fix/session-process-owner, fix/pty-io-lifecycle, fix/skia-vulkan-api-contract, fix/engine-handle-lifetime, fix/engine-adoption, refactor/test-normalization, feature/rust-integration]
    paths:
      - 'terminal-emulator/src/main/java/**'
      - 'terminal-emulator/src/main/rust/**'
      - 'scripts/kotlin/EngineHandleNative.kt'
      - 'scripts/kotlin/EngineDeliveryNative.kt'
      - 'scripts/java/delivery-stubs/**'
      - 'scripts/verify-engine-handle-boundary.py'
      - 'scripts/verify-pty-io-boundary.py'
      - 'scripts/verify-process-owner-boundary.py'
      - 'scripts/verify-delivery-boundary.py'
      - 'scripts/verify-completion-result.py'
      - 'app/src/main/java/com/termux/app/terminal/TermuxTerminalSessionActivityClient.java'
      - 'app/src/main/java/com/termux/app/terminal/TermuxTerminalSessionServiceClient.java'
      - 'termux-shared/src/main/java/com/termux/shared/termux/shell/command/runner/terminal/TermuxSession.java'
      - 'app/src/main/java/com/termux/app/TermuxService.java'
      - 'scripts/kotlin/EmulatorConstruction*.kt'
      - 'scripts/verify-emulator-construction.py'
      - '.github/workflows/engine-construction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-construction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  constructor-contract:
    name: Kotlin construction contract and real JNI ownership
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'
      - name: Prepare Kotlin compile dependencies
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          mkdir -p "$RUNNER_TEMP/engine-construction-deps"
          curl --fail --location --retry 3 \
            https://dl.google.com/dl/android/maven2/androidx/annotation/annotation/1.3.0/annotation-1.3.0.jar \
            -o "$RUNNER_TEMP/engine-construction-deps/annotation.jar"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native library dependencies
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            terminal-emulator/src/main/rust/target
          key: ${{ runner.os }}-engine-jni-${{ hashFiles('terminal-emulator/src/main/rust/Cargo.lock') }}
      - name: Build actual JNI library and check ownership boundary
        run: |
          python3 scripts/verify-engine-handle-boundary.py
          python3 scripts/verify-pty-io-boundary.py
          python3 scripts/verify-process-owner-boundary.py
          python3 scripts/verify-delivery-boundary.py
          python3 scripts/verify-completion-result.py
          cd terminal-emulator/src/main/rust
          cargo build --locked --lib
      - name: Verify recording contract and real Kotlin JNI
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path
          lib = Path(shutil.which('gradle')).resolve().parents[1] / 'lib'
          stdlibs = list(lib.glob('kotlin-stdlib-[0-9]*.jar'))
          assert len(stdlibs) == 1, stdlibs
          stdlib = stdlibs[0]
          annotation = Path(os.environ['RUNNER_TEMP']) / 'engine-construction-deps/annotation.jar'
          android = Path(os.environ['ANDROID_HOME']) / 'platforms/android-36/android.jar'
          for mode in ('contract', 'native', 'handles', 'delivery'):
              subprocess.run([
                  'python3', 'scripts/verify-emulator-construction.py',
                  '--compiler-classpath', str(lib / '*'),
                  '--compile-classpath', os.pathsep.join(map(str, [android, annotation, stdlib])),
                  '--runtime-classpath', str(stdlib),
                  '--native-library', 'terminal-emulator/src/main/rust/target/debug/libtermux_rust.so',
                  '--mode', mode, '--output', 'build/engine-construction-evidence',
              ], check=True)
          PY
      - name: Save separate contract and JNI evidence (not ART/GPU acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-construction-contract
          path: build/engine-construction-evidence
          if-no-files-found: warn
