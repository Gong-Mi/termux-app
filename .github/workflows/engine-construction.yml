name: Engine construction contract

"on":
  pull_request:
    branches: [refactor/test-normalization, feature/rust-integration]
    paths:
      - 'terminal-emulator/src/main/java/**'
      - 'scripts/kotlin/EmulatorConstruction*.kt'
      - 'scripts/verify-emulator-construction.py'
      - '.github/workflows/engine-construction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-construction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  constructor-contract:
    name: Kotlin constructor call contract (recording JNI boundary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'
      - name: Prepare Kotlin compile dependencies
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          mkdir -p "$RUNNER_TEMP/engine-construction-deps"
          curl --fail --location --retry 3 \
            https://dl.google.com/dl/android/maven2/androidx/annotation/annotation/1.3.0/annotation-1.3.0.jar \
            -o "$RUNNER_TEMP/engine-construction-deps/annotation.jar"
      - name: Verify actual Kotlin constructor dispatch
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path
          lib = Path(shutil.which('gradle')).resolve().parents[1] / 'lib'
          stdlibs = list(lib.glob('kotlin-stdlib-[0-9]*.jar'))
          assert len(stdlibs) == 1, stdlibs
          stdlib = stdlibs[0]
          annotation = Path(os.environ['RUNNER_TEMP']) / 'engine-construction-deps/annotation.jar'
          android = Path(os.environ['ANDROID_HOME']) / 'platforms/android-36/android.jar'
          subprocess.run([
              'python3', 'scripts/verify-emulator-construction.py',
              '--compiler-classpath', str(lib / '*'),
              '--compile-classpath', os.pathsep.join(map(str, [android, annotation, stdlib])),
              '--runtime-classpath', str(stdlib),
              '--native-library', 'not-used-in-contract-mode',
              '--mode', 'contract', '--output', 'build/engine-construction-evidence',
          ], check=True)
          PY
      - name: Save contract evidence (not native/device acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-construction-contract
          path: build/engine-construction-evidence
          if-no-files-found: warn
